plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
    id 'me.modmuss50.mod-publish-plugin' version '0.8.4'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 17 }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar { from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } } }

// ---- Game tests (headless, server-side): ./gradlew runGametest ----
sourceSets {
    gametest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

loom {
    runs {
        gametest {
            server()
            name "Game Test"
            source sourceSets.gametest
            vmArg "-Dfabric-api.gametest"
            vmArg "-Xmx6G"
            vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/gametest/report.xml"
            runDir "build/gametest-run"
        }
    }
}

tasks.register('gametestJar', Jar) {
    from sourceSets.gametest.output
    archiveClassifier = 'gametest-dev'
}
tasks.register('remapGametestJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn tasks.named('gametestJar')
    inputFile = tasks.named('gametestJar').flatMap { it.archiveFile }
    archiveClassifier = 'gametest'
    addNestedDependencies = false
}

// ---- Modrinth release: MODRINTH_TOKEN=<pat> ./gradlew publishModrinth ----
publishMods {
    file = remapJar.archiveFile
    changelog = providers.fileContents(layout.projectDirectory.file("CHANGELOG.md")).asText
    type = STABLE
    displayName = "Infinite Stack in Storage ${project.mod_version} for ${project.minecraft_version}"
    modLoaders.add("fabric")

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = project.modrinth_project_id
        minecraftVersions.add(project.minecraft_version)
        requires("fabric-api")
    }
}
